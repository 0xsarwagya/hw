# Netlify Configuration for HW Storefront (Vite + React SPA)
# Note: For monorepo deployments, create a separate Netlify site for this app
# Or configure build settings in Netlify dashboard

[build]
  # Build command for the storefront app in monorepo
  command = "pnpm --filter @vestcodes/vcecom-hw-storefront build"
  # Publish directory (relative to repo root)
  publish = "apps/hw-storefront/dist"

[build.environment]
  # Node.js version
  NODE_VERSION = "20.x"

# SPA redirects - all routes should serve index.html
# This is required for React Router to work properly
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Don't cache HTML files
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
