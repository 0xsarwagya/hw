<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hush & Wear</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://s6.imgcdn.dev/YT5tM2.png" />
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons|Material+Icons+Outlined|Material+Symbols+Outlined"
      rel="stylesheet"
    />
    
    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#0074A4",
              secondary: "#E3F0FF",
              accent: "#FFD700",
              lime: "#b0ec63",
              dark: "#0a0a0a",
            },
            fontFamily: {
              display: ["Instrument Sans", "sans-serif"],
              sans: ["Instrument Sans", "sans-serif"],
            },
            animation: {
              'marquee': 'marquee 25s linear infinite',
              'marquee-slow': 'marquee 60s linear infinite',
              'fade-in': 'fade-in 0.5s ease-out',
              'slide-up': 'slide-up 0.5s ease-out',
              'pop-in': 'pop-in 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275)',
              'slide-down': 'slide-down 0.3s ease-out',
            },
            keyframes: {
              marquee: {
                '0%': { transform: 'translateX(0)' },
                '100%': { transform: 'translateX(-50%)' },
              },
              'fade-in': {
                'from': { opacity: '0' },
                'to': { opacity: '1' },
              },
              'slide-up': {
                'from': { transform: 'translateY(20px)', opacity: '0' },
                'to': { transform: 'translateY(0)', opacity: '1' },
              },
              'pop-in': {
                '0%': { transform: 'scale(0.8)', opacity: '0' },
                '100%': { transform: 'scale(1)', opacity: '1' },
              },
              'slide-down': {
                'from': { transform: 'translateY(-10px)', opacity: '0' },
                'to': { transform: 'translateY(0)', opacity: '1' },
              }
            }
          },
        },
      }
    </script>

    <!-- Import Map -->
    <script type="importmap">
{
  "imports": {
    "react-dom/client": "https://aistudiocdn.com/react-dom@^19.2.1/client",
    "react-dom": "https://aistudiocdn.com/react-dom@^19.2.1",
    "react-router-dom": "https://aistudiocdn.com/react-router-dom@^7.10.1",
    "react": "https://aistudiocdn.com/react@^19.2.1",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/",
    "react/": "https://aistudiocdn.com/react@^19.2.1/",
    "vite": "https://aistudiocdn.com/vite@^7.2.6",
    "@vitejs/plugin-react": "https://aistudiocdn.com/@vitejs/plugin-react@^5.1.1",
    "path": "https://aistudiocdn.com/path@^0.12.7",
    "url": "https://aistudiocdn.com/url@^0.11.4",
    "@tanstack/react-query": "https://aistudiocdn.com/@tanstack/react-query@^5.28.4",
    "@tanstack/react-query-persist-client": "https://aistudiocdn.com/@tanstack/react-query-persist-client@^5.28.4",
    "@tanstack/query-sync-storage-persister": "https://aistudiocdn.com/@tanstack/query-sync-storage-persister@^5.28.4",
    "fuse.js": "https://aistudiocdn.com/fuse.js@^7.0.0"
  }
}
</script>
</head>
  <body class="bg-white text-black antialiased">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
