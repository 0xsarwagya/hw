name: Change Default Branch to Dev

on:
  workflow_dispatch:

jobs:
  change-default:
    name: Instructions to change default branch
    runs-on: ubuntu-latest
    steps:
      - name: Instructions
        run: |
          echo "To change the default branch from 'main' to 'dev':"
          echo ""
          echo "1. Go to GitHub repository settings"
          echo "2. Navigate to 'Branches' section"
          echo "3. Under 'Default branch', click the switch/edit icon"
          echo "4. Select 'dev' as the default branch"
          echo "5. Confirm the change"
          echo ""
          echo "After changing the default branch, you can delete 'main' branch:"
          echo "  git push origin --delete main"

