[changelog]
header = """
# Changelog\n
All notable changes to this project will be documented in this file.\n
"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {% for commit in commits %}
    - {% if commit.breaking %}\
        **[BREAKING]** \
    {% endif %}\
    {% if commit.scope %}\
        **{{commit.scope}}**: \
    {% endif %}\
    {{ commit.message | upper_first }}\
    {% if commit.id %}\
        ({{ commit.id | truncate(length=8, end="") }})\
    {% endif %}
    {% endfor %}
{% endfor %}\n
"""
trim = true
footer = "<!-- generated by git-cliff -->"

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_parsers = [
    { message = "^feat\\((.+)\\): (.+)", group = "Features", scope = "$1", breaking = false },
    { message = "^fix\\((.+)\\): (.+)", group = "Bug Fixes", scope = "$1", breaking = false },
    { message = "^docs\\((.+)\\): (.+)", group = "Documentation", scope = "$1", breaking = false },
    { message = "^refactor\\((.+)\\): (.+)", group = "Refactoring", scope = "$1", breaking = false },
    { message = "^perf\\((.+)\\): (.+)", group = "Performance", scope = "$1", breaking = false },
    { message = "^test\\((.+)\\): (.+)", group = "Testing", scope = "$1", breaking = false },
    { message = "^build\\((.+)\\): (.+)", group = "Build", scope = "$1", breaking = false },
    { message = "^ci\\((.+)\\): (.+)", group = "CI", scope = "$1", breaking = false },
    { message = "^chore\\((.+)\\): (.+)", group = "Miscellaneous", scope = "$1", breaking = false },
    { message = "^feat!: (.+)", group = "Features", breaking = true },
    { message = "^fix!: (.+)", group = "Bug Fixes", breaking = true },
    { message = "^refactor!: (.+)", group = "Refactoring", breaking = true },
]
link_parsers = [
    { pattern = "\\[([^\\]]+)\\]\\(([^)]+)\\)", href = "$2", text = "$1" },
]
tag_pattern = "v?[0-9]+\\.[0-9]+\\.[0-9]+.*"
skip_tags = ["v0.1.0-test", "v0.1.0-test2"]
topo_order = false
sort_commits = "oldest"

[changelog.preprocessor]
pattern = '^(.+)$'
replace = '$1'

[changelog.postprocessors]
unwrap = true

