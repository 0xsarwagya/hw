# Netlify Configuration for Admin App (Monorepo)

[build]
  # Build command for the admin app in monorepo
  command = "pnpm --filter @vestcodes/vcecom-admin build"
  # Publish directory (relative to repo root)
  publish = "apps/admin/.next"

[build.environment]
  # Node.js version
  NODE_VERSION = "20.x"
  # Disable Next.js telemetry
  NEXT_TELEMETRY_DISABLED = "1"

# Redirects for Next.js (handled by Next.js plugin)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Next.js plugin (required for Next.js apps on Netlify)
[[plugins]]
  package = "@netlify/plugin-nextjs"

