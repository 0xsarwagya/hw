services:
  postgres:
    image: postgres:16-alpine
    container_name: vcecom-postgres-dev
    environment:
      POSTGRES_USER: vcecom
      POSTGRES_PASSWORD: vcecom_dev_password
      POSTGRES_DB: vcecom_test
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vcecom"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vcecom-network

  redis:
    image: redis:7-alpine
    container_name: vcecom-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vcecom-network

  minio:
    image: minio/minio:latest
    container_name: vcecom-minio-dev
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - vcecom-network

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: vcecom-zipkin-dev
    ports:
      - "9411:9411"
    environment:
      - STORAGE_TYPE=mem
    networks:
      - vcecom-network

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  vcecom-network:
    driver: bridge

