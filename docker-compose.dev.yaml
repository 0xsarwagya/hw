version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: vcecom-postgres-dev
    environment:
      POSTGRES_USER: vcecom
      POSTGRES_PASSWORD: vcecom_dev_password
      POSTGRES_DB: vcecom
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vcecom"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vcecom-network

  redis:
    image: redis:7-alpine
    container_name: vcecom-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vcecom-network

volumes:
  postgres_data:
  redis_data:

networks:
  vcecom-network:
    driver: bridge

